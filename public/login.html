<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Malta Experience - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/login.css">
    <script src="./js/sessao.js"></script>

</head>

<body>

    <div class="cabecalho">
        <h3 class="logo">Malta <span class="logo_verde">Experience</span></h3>
        <div class="menu">
            <a href="index.html#como">Como funciona</a>
            <a href="index.html#info">Informações</a>
            <a href="index.html#calculadora">Calculadora</a>
            <a href="index.html#cidades">Cidades</a>
        </div>
        <div class="botoes_topo">
            <a class="link_botao" href="login.html">Acessar conta</a>
            <a class="link_botao_verde" href="cadastro.html">Criar conta</a>
        </div>
    </div>

    <div class="fundo_conta">
        <div class="cartao_conta">
            <div class="lado_form">
                <h1 class="titulo_conta">Acesse sua conta</h1>
                <p>Digite seu e-mail e sua senha.</p>
                <label>E-mail</label>
                <input class="campo_conta" id="input_email" type="text" placeholder="voce@email.com">

                <label>Senha</label>
                <input class="campo_conta" id="input_senha" type="password" placeholder="Digite sua senha">

                <button class="botao_amarelo" onclick="entrarConta()">Entrar</button>
                <div class="mensagem_conta" id="div_exibir"></div>
                <p class="troca_conta">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
            </div>
        </div>
    </div>

   

</body>

</html>

<script>


    function entrarConta() {
      //  aguardar();
        let emailVar = input_email.value;
        let senhaVar = input_senha.value;
            console.log('ESSE É O EMAIL')
            console.log(emailVar)


            if (emailVar == "" || senhaVar == "") {
                div_exibir.innerHTML = "<span style='color: red'>Preencha o e-mail e a senha.</span>";
            } else if (emailVar.indexOf("@") == -1) {
                div_exibir.innerHTML = "<span style='color: red'>Digite um e-mail válido.</span>";
            } else if (senhaVar.length < 8) {
                div_exibir.innerHTML = "<span style='color: red'>A senha precisa ter no mínimo 8 caracteres.</span>";
            }

        // var emailVar = input_email.value;
        // var senhaVar = input_senha.value;

        // if (emailVar == "" || senhaVar == "") {
        //   //  cardErro.style.display = "block"
        //     //mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
        //     finalizarAguardar();
        //     return false;
        // }
        // else {
        //    // setInterval(sumirMensagem, 5000)
        // }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log("ENTREI NO IF")
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome_completo;
                   // sessionStorage.ID_USUARIO = json.id;
                   // sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./index.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    // function sumirMensagem() {
    //     cardErro.style.display = "none"
    // }

</script>
